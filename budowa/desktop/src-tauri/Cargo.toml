[package]
# Nazwa pakietu jest zarazem nazwą pliku wykonywalnego (danaco-console-powloka.exe):
# tę samą nazwę niesie stała NAZWA_PROGRAMU w instalator/src-tauri/src/pobranie.rs,
# po której instalator szuka programu po założeniu. Zmiana jednej wymaga zmiany drugiej.
name = "danaco-console-powloka"
version = "2.0.0"
description = "Danaco Console — powłoka okna dla Windows 11"
authors = ["Danaco Holding Group Sp. z o.o."]
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# Sekret nawiązania powstaje z losowości systemu (`src/sekret.rs`).
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
