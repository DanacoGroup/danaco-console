<!-- Motyw ciemny zapada przed `wspolne.js`, ktore inaczej wzieloby nastawe systemu.

       wybor mialby uszanowac. Rozstrzygniecie 21 rejestru decyzji. -->
  <script>
    document.documentElement.dataset.theme = 'dark';
    try { localStorage.setItem('dn-motyw', 'dark'); } catch (e) {}
