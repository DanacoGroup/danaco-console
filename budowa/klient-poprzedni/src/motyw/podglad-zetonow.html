<!doctype html>
<!-- Rusztowanie podglądowe żetonów motywu nie wchodzi do pakietu produktu: wykłada komplet barw, typografii, przestrzeni i ruchu w obu motywach na jednym ekranie. -->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danaco Console — podgląd żetonów (rusztowanie)</title>
    <link rel="stylesheet" href="./motyw.css" />
    <style>
      /* Układ samego podglądu — wartości pochodzą z żetonów, poza dwoma
         miejscami, dla których żetonu nie ma:
           · minmax(160px, 1fr) — szerokość kolumny siatki kafli,
           · border: 1px        — grubość włosowa obrysu. */
      body {
        margin: 0;
        padding: var(--dn-od-8);
        background-color: var(--dn-tlo);
        color: var(--dn-tekst);
        font-family: var(--dn-ff-bazowa);
        font-size: var(--dn-fs-base);
        line-height: var(--dn-lh-bazowy);
      }
      h1 {
        font-family: var(--dn-ff-naglowek);
        font-size: var(--dn-fs-3xl);
        font-weight: var(--dn-fw-polgruba);
        line-height: var(--dn-lh-ciasny);
        letter-spacing: var(--dn-ls-naglowek);
        margin: 0 0 var(--dn-od-2);
      }
      h2 {
        font-family: var(--dn-ff-naglowek);
        font-size: var(--dn-fs-xl);
        font-weight: var(--dn-fw-polgruba);
        margin: 0 0 var(--dn-od-4);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--dn-od-4);
        margin-bottom: var(--dn-od-8);
      }
      section {
        background-color: var(--dn-powierzchnia);
        border: 1px solid var(--dn-obrys);
        border-radius: var(--dn-r-lg);
        box-shadow: var(--dn-cien-2);
        padding: var(--dn-od-6);
        margin-bottom: var(--dn-od-6);
      }
      .siatka {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: var(--dn-od-3);
      }
      .probka {
        border: 1px solid var(--dn-obrys-subtelny);
        border-radius: var(--dn-r-sm);
        overflow: hidden;
      }
      .probka i {
        display: block;
        height: var(--dn-od-12);
      }
      .probka span {
        display: block;
        padding: var(--dn-od-2);
        font-family: var(--dn-ff-mono);
        font-size: var(--dn-fs-xs);
        color: var(--dn-tekst-2);
        background-color: var(--dn-powierzchnia-2);
      }
      .plakietka {
        display: inline-flex;
        align-items: center;
        gap: var(--dn-od-2);
        padding: var(--dn-od-1) var(--dn-od-3);
        border-radius: var(--dn-r-pill);
        border: 1px solid;
        font-size: var(--dn-fs-sm);
        font-weight: var(--dn-fw-srednia);
      }
      .przycisk {
        min-height: var(--dn-wym-kontrolka);
        padding: 0 var(--dn-od-4);
        border-radius: var(--dn-r-sm);
        border: 1px solid var(--dn-obrys-mocny);
        background-color: var(--dn-powierzchnia);
        color: var(--dn-tekst);
        font-family: var(--dn-ff-bazowa);
        font-size: var(--dn-fs-base);
        cursor: pointer;
        transition: background-color var(--dn-czas-1) var(--dn-ease);
      }
      .przycisk:hover {
        background-color: var(--dn-hover);
      }
      /* Działanie główne = inwersja atramentu (czarny na jasnym, biały na
         ciemnym). Sygnał wskazuje, nie działa — dlatego nie jest tu użyty. */
      .przycisk--glowny {
        background-color: var(--dn-atrament);
        border-color: var(--dn-atrament);
        color: var(--dn-atrament-tekst);
        box-shadow: var(--dn-cien-1);
      }
      .rzad {
        display: flex;
        flex-wrap: wrap;
        gap: var(--dn-od-3);
        align-items: center;
      }
      .skala li {
        list-style: none;
        margin-bottom: var(--dn-od-2);
      }
      .skala {
        margin: 0;
        padding: 0;
      }
      .odstep {
        background-color: var(--dn-atrament);
        border-radius: var(--dn-r-xs);
        height: var(--dn-od-2);
      }
      code {
        font-family: var(--dn-ff-mono);
        font-size: var(--dn-fs-sm);
        color: var(--dn-sygnal);
        background-color: var(--dn-sygnal-tlo);
        border-radius: var(--dn-r-xs);
        padding: 0 var(--dn-od-1);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Warstwa żetonów</h1>
        <p class="dn-etykieta-wersalikowa">Danaco Console · system wizualny</p>
      </div>
      <div class="rzad">
        <span id="stan-motywu" class="dn-etykieta-wersalikowa"></span>
        <button class="przycisk" id="motyw-jasny" type="button">Jasny</button>
        <button class="przycisk" id="motyw-ciemny" type="button">Ciemny</button>
        <button class="przycisk" id="motyw-system" type="button">Preferencja systemu</button>
        <button class="przycisk przycisk--glowny" id="motyw-przelacz" type="button">Przełącz</button>
      </div>
    </header>

    <section>
      <h2>Barwy prymitywne</h2>
      <div class="siatka" id="prymitywy"></div>
    </section>

    <section>
      <h2>Żetony semantyczne — aktywny motyw</h2>
      <div class="siatka" id="semantyczne"></div>
    </section>

    <section>
      <h2>Rama kokpitu — stała w obu motywach</h2>
      <div class="siatka" id="rama"></div>
    </section>

    <section>
      <h2>Gradienty — wyłącznie ilustracyjne</h2>
      <div class="siatka" id="gradienty"></div>
    </section>

    <section>
      <h2>Barwy stanu</h2>
      <div class="rzad" id="stany"></div>
    </section>

    <section>
      <h2>Typografia</h2>
      <ul class="skala" id="typografia"></ul>
    </section>

    <section>
      <h2>Przestrzeń, promienie, cienie, ruch</h2>
      <ul class="skala" id="przestrzen"></ul>
      <div class="rzad" id="promienie"></div>
      <div class="rzad" id="cienie"></div>
    </section>

    <section>
      <h2>Wymiary, siatka, warstwy</h2>
      <ul class="skala" id="wymiary"></ul>
      <ul class="skala" id="siatka"></ul>
      <ul class="skala" id="warstwy"></ul>
    </section>

    <script type="module" src="./podglad-zetonow.ts"></script>
  </body>
</html>
