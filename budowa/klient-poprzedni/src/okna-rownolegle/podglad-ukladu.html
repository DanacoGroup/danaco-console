<!-- Strona podglądowa układu okien równoległych działa bez rdzenia, kanału kontraktu i sesji — wyłącznie żetony motywu, żadnej wartości zaszytej wprost. -->
<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danaco Console — podgląd układu okien równoległych</title>
    <style>
      /* Rozkład samej strony podglądu. Wyłącznie żetony — żadnej wartości
         zaszytej. Arkusze warstw wizualnych wciąga moduł wejściowy. */
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #danaco-podglad {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100vh;
        overflow: hidden;
      }

      .dn-proba__pulpit {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: var(--dn-od-6);
        padding: var(--dn-od-3) var(--dn-od-4);
        border-top: 1px solid var(--dn-obrys);
      }

      .dn-proba__grupa {
        display: flex;
        flex-direction: column;
        gap: var(--dn-od-2);
      }

      .dn-proba__etykieta {
        color: var(--dn-tekst-3);
        font-size: var(--dn-fs-xs);
        font-weight: var(--dn-fw-polgruba);
        letter-spacing: var(--dn-ls-wersaliki);
        text-transform: uppercase;
      }

      .dn-proba__rzad {
        display: flex;
        flex-wrap: wrap;
        gap: var(--dn-od-2);
      }
    </style>
  </head>
  <body>
    <div id="danaco-podglad"></div>
    <script type="module" src="./podglad-ukladu.ts"></script>
  </body>
</html>
