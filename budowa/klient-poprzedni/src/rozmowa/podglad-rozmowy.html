<!doctype html>
<!--
  Rusztowanie podglądowe; nie wchodzi do pakietu produktu.

  Pokazuje warstwę rozmowy samą — bez powłoki, bez nawigacji modułów, bez pasa
  kart sesji — na żywym rdzeniu i z przełącznikiem motywu, więc usterkę rozmowy
  widać bez zgadywania, czy winna jest rozmowa, czy warstwa ją osadzająca.

  Poprawny wygląd tej strony nie dowodzi, że rozmowa działa w produkcie:
  produkt osadza ją w module, w powłoce i w oknie sesji, których tu nie ma.
-->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danaco Console — podgląd rozmowy (rusztowanie)</title>
    <style>
      /* Wyłącznie ramka podglądu. Wygląd rozmowy niesie rozmowa.css. */
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
        background-color: var(--dn-tlo);
        color: var(--dn-tekst);
        font-family: var(--dn-ff-bazowa);
        font-size: var(--dn-fs-base);
        line-height: var(--dn-lh-bazowy);
      }

      .podglad-pasek {
        display: flex;
        align-items: center;
        gap: var(--dn-od-4);
        height: var(--dn-wym-pasek);
        padding: 0 var(--dn-od-5);
        background-color: var(--dn-rama);
        color: var(--dn-rama-tekst);
      }

      .podglad-godlo {
        font-family: var(--dn-ff-naglowek);
        font-size: var(--dn-fs-xl);
        font-weight: var(--dn-fw-polgruba);
        letter-spacing: var(--dn-ls-naglowek);
      }

      .podglad-stan {
        margin-left: auto;
        font-family: var(--dn-ff-mono);
        font-size: var(--dn-fs-xs);
      }

      .podglad-scena {
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="podglad-pasek">
      <span class="podglad-godlo">Danaco Console</span>
      <span class="dn-etykieta-wersalikowa">Warstwa rozmowy</span>
      <span class="podglad-stan" id="stan">Łączenie z rdzeniem…</span>
      <button class="dn-btn dn-btn--zarys" id="motyw" type="button">Motyw ciemny</button>
    </header>
    <main class="podglad-scena" id="scena"></main>
    <script type="module" src="./podglad-rozmowy.ts"></script>
  </body>
</html>
