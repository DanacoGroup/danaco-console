<!--
  Dokument klienta: obszary drogi wejścia, po nich gniazdo powłoki.

  Okna buduje biblioteka `design/zasoby/`. Dokument nie niesie ani jednego
  zdania widocznego dla Operatora poza nazwą produktu w tytule karty.

  Trzy miejsca drogi wejścia stoją w dokumencie naraz, bo biblioteka buduje
  okna raz, przy starcie. Widoczny jest ten obszar, którego widok jest czynny.

  Motywu dokument nie narzuca: `zetony.css` daje `:root:not([data-theme])`
  motyw zgodny z ustawieniem systemu, a żadne źródło nie wskazuje motywu,
  od którego produkt ma się zaczynać.
-->
<body class="pt-pelny-ekran">

<div data-wejscie>
<!-- Animacja uruchomienia stoi wewnątrz sceny, bo `przeplyw-wejscia.js` szuka
     warstwy `[data-uruchomienie]` w scenie i na niej wiąże koniec animacji;
     `data-czekaj` trzyma bieg do wywołania `gotowe()`. -->
<div class="we-scena" data-uruchomienie-scena>
  <div class="we-uruchomienie" data-uruchomienie>
    <div class="dn-ekran-startowy" data-ekran-startowy data-czekaj
         role="img" aria-label="Uruchamianie Danaco Console"></div>
  </div>
  <div data-wejscie-okno="uruchomienie"></div>
</div>

<div class="we-scena">
  <div data-wejscie-okno="dostep"></div>
</div>

<div class="we-scena">
  <div data-wejscie-okno="przygotowanie"></div>
</div>
</div>

<!-- Gniazdo powłoki. `zasoby/powloka.js` wypełnia je znacznikiem stałych
     elementów okna — szyną nawigacji, belką tytułową, pasem narzędzi i paskiem
     stanu — sklejając je wokół treści z szablonu poniżej. Rama wstawia potem
     okno modułu w `.dn-rama-prawa`, nie buduje powłoki sama. -->
<div data-rama-aplikacji id="dn-powloka-montaz" class="sta-powloka" hidden></div>

<!-- Wnętrza okien. Puste, bo wypełnia je `vite.config.js` blokami zdjętymi
     z prototypów; powłoka wkleja `dn-tresc-okna` w ramę przy starcie, a wiązanie
     Centrum podmienia je na `dn-tresc-studio` przy otwarciu modułu. -->
<template id="dn-tresc-okna"></template>
<template id="dn-tresc-przedsionek-talkin"></template>
<template id="dn-tresc-przedsionek-workspace"></template>
<template id="dn-tresc-przedsionek-codestudio"></template>
<template id="dn-tresc-przedsionek-multitaskingai"></template>
<template id="dn-tresc-studio"></template>

<!--

  i atrybuty `data-*`, nie moduły — bez `type="module"`, tak jak w źródle.
-->
