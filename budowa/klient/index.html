<!doctype html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danaco Console</title>
<link rel="icon" href="../../design/zasoby/marka/favicon/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./arkusze.css">
</head>

<!--
  Dokument klienta: scena drogi wejścia, po niej miejsce ramy aplikacji.

  Niesie wyłącznie miejsca montażu i oprawę sceny. Okna drogi wejścia składa
  `wejscie/montaz.ts`, ramę aplikacji `rama/montaz.ts` — dokument nie ma ani
  jednego zdania widocznego dla użytkownika poza nazwą produktu w tytule karty.

  Trzy miejsca montażu drogi wejścia, po jednym na etap. Stoją w dokumencie
  wszystkie naraz, bo montaż buduje okna raz, przy starcie; widoczne jest to,
  w którym stoi czynna odsłona. Rama zaczyna ukryta — `aplikacja.ts` zdejmuje
  scenę drogi wejścia i odkrywa ramę dokładnie wtedy, gdy przebieg wchodzi do
  środowiska; do tej chwili miejsce ramy stoi puste.

  Motywu dokument nie narzuca: `zetony.css` daje `:root:not([data-theme])`
  motyw zgodny z ustawieniem systemu, a żadne źródło nie wskazuje motywu,
  od którego produkt ma się zaczynać.
-->
<body>

<div data-wejscie>
<div class="we-scena">
  <div data-wejscie-okno="uruchomienie"></div>
</div>

<div class="we-scena">
  <div data-wejscie-okno="dostep"></div>
</div>

<div class="we-scena">
  <div data-wejscie-okno="przygotowanie"></div>
</div>
</div>

<div data-rama-aplikacji hidden></div>

<script type="module" src="./src/aplikacja.ts"></script>
</body>
</html>
