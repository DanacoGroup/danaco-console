<!doctype html>

<head>

<!--
  Dokument okna drogi wejścia.

  Niesie wyłącznie miejsca montażu i oprawę sceny. Okna składa `montaz.ts`
  ze składników, a tekst niesie `tresci.ts` — dokument nie ma ani jednego
  zdania widocznego dla użytkownika poza nazwą produktu w tytule karty.

  Trzy miejsca montażu, po jednym na etap drogi wejścia. Stoją w dokumencie
  wszystkie naraz, bo montaż buduje okna raz, przy starcie; widoczne jest to,
  w którym stoi czynna odsłona.

  Motywu dokument nie narzuca: `zetony.css` daje `:root:not([data-theme])`
  motyw zgodny z ustawieniem systemu, a żadne źródło nie wskazuje motywu,
  od którego produkt ma się zaczynać.
-->
<body>

<div class="we-scena">
  <div data-wejscie-okno="uruchomienie"></div>
</div>

<div class="we-scena">
  <div data-wejscie-okno="dostep"></div>
</div>

<div class="we-scena">
  <div data-wejscie-okno="przygotowanie"></div>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
