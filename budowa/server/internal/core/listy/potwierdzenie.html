<!--
  Szablon listu systemowego Danaco Console — postać graficzna.

  Papeteria wzięta z materiałów marki (`design/03-marka/zastosowania/html/`):
  znak, barwy i typografia te same, co w sygnaturze poczty i na papierze
  firmowym. Znak idzie wpisany w treść (base64), nie odsyłaczem — klienty
  pocztowe blokują obrazy zewnętrzne domyślnie, a list z niewidocznym znakiem
  czyta się jak podszycie.

  Układ stoi na tabelach i stylach wpisanych w znaczniki, bo klienty pocztowe
  nie znają arkusza w nagłówku ani nowoczesnego układu. To nie jest zaniedbanie
  — to jedyna postać, która dochodzi tak samo do Outlooka, Gmaila i telefonu.

  Wartości w {nawiasach} podstawia rdzeń.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="border-collapse:collapse;width:100%;background:#F3F4F6;padding:32px 0;">
  <tr>
    <td align="center" style="padding:0 16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"
             style="border-collapse:collapse;width:100%;max-width:560px;background:#FFFFFF;
                    border:1px solid #E3E3E3;border-radius:6px;">
        <tr>
          <td style="padding:28px 32px 20px 32px;">
            <img src="{znak}" width="168" height="72" alt="Danaco Console"
                 style="display:block;border:0;outline:none;text-decoration:none;width:168px;height:auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 4px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;
                     font-size:19px;line-height:26px;font-weight:600;color:#16181D;">
            {naglowek}
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 20px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;
                     font-size:15px;line-height:22px;color:#4A4A4A;">
            {wstep}
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 8px 32px;font-family:'IBM Plex Mono','Courier New',monospace;
                     font-size:11px;line-height:16px;letter-spacing:1.4px;text-transform:uppercase;color:#7C7C7C;">
            {etykietaKodu}
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 20px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                   style="border-collapse:collapse;background:#F3F4F6;border:1px solid #E3E3E3;border-radius:4px;">
              <tr>
                <td style="padding:14px 24px;font-family:'IBM Plex Mono','Courier New',monospace;
                           font-size:28px;line-height:34px;letter-spacing:8px;color:#16181D;font-weight:600;">
                  {kod}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 20px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;
                     font-size:15px;line-height:22px;color:#4A4A4A;">
            {polecenie}
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;width:100%;">
              <tr><td height="1" style="height:1px;line-height:1px;font-size:0;background:#E3E3E3;">&nbsp;</td></tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 8px 32px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;
                     font-size:13px;line-height:19px;color:#616161;">
            {nota}
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 28px 32px;font-family:'IBM Plex Mono','Courier New',monospace;
                     font-size:11px;line-height:16px;color:#7C7C7C;">
            Danaco Holding Group Sp. z o.o. · support@danaco-core.pl
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
