<!-- Plik zawiera komplet wpięć godła dokumentu do wklejenia w nagłówek strony; kolejność wpisów jest znacząca dla przeglądarki. -->

<!-- Nośnik podstawowy to plik SVG adaptacyjny, który przełącza barwy zgodnie z preferencją koloru systemu operacyjnego. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- Zapas rastrowy dla starszych przeglądarek to plik ICO w rozmiarach szesnaście, trzydzieści dwa i czterdzieści osiem pikseli na kryjącym gruncie. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">

<!-- Ikona dla systemów iOS i iPadOS jest kwadratem bez zaokrąglenia i bez kanału alfa, ponieważ maskę nakłada sam system operacyjny. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Manifest aplikacji internetowej niesie nazwę, barwy, ikony oraz skróty do poszczególnych środowisk pracy aplikacji. -->
<link rel="manifest" href="/site.webmanifest">

<!-- Barwa paska systemowego tworzy ramę kokpitu w motywie ciemnym, a w motywie jasnym przyjmuje barwę papieru roboczego. -->
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">

<!-- Kafel systemu Windows jest opcjonalny i działa bez osobnego pliku konfiguracyjnego przeglądarki internetowej. -->
<meta name="msapplication-TileColor" content="#111317">
<meta name="msapplication-TileImage" content="/icon-192.png">

<!-- Nazwa aplikacji w trybie samodzielnym pojawia się w systemie operacyjnym po zainstalowaniu aplikacji na urządzeniu. -->
<meta name="application-name" content="Danaco Console">
<meta name="apple-mobile-web-app-title" content="Danaco Console">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
