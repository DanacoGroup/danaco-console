<!-- Fragment znacznika udostępnia komplet wpięć godła dokumentu, w którym przeglądarka obsługująca format SVG korzysta z pierwszego wpisu, a starsza sięga po plik ICO spod ścieżki domyślnej. -->

<!-- Węzeł podstawowy udostępnia ikonę w formacie SVG, dostosowującą barwę do preferowanego motywu przeglądarki użytkownika. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- Węzeł zapasowy udostępnia ikonę w formacie ICO w trzech rozmiarach dla przeglądarek nieobsługujących formatu SVG. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">

<!-- Węzeł ikony dotykowej dla systemu iOS i iPadOS ma kształt kwadratu bez zaokrąglenia i bez kanału przezroczystości. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Węzeł manifestu aplikacji internetowej niesie nazwę programu, barwy, ikony oraz skróty do poszczególnych środowisk. -->
<link rel="manifest" href="/site.webmanifest">

<!-- Barwa paska systemowego różni się między motywem ciemnym a jasnym, dopasowując ramę okna do wybranego wyglądu programu. -->
<meta name="theme-color" content="#F4F4F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">

<!-- Węzeł kafla systemu Windows określa barwę oraz obraz kafla wyświetlanego po przypięciu strony do ekranu startowego. -->
<meta name="msapplication-TileColor" content="#131313">
<meta name="msapplication-TileImage" content="/icon-192.png">

<!-- Węzeł nazwy aplikacji ustala tytuł programu wyświetlany w trybie samodzielnym na urządzeniach mobilnych i pulpitowych. -->
<meta name="application-name" content="Danaco Console">
<meta name="apple-mobile-web-app-title" content="Danaco Console">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
