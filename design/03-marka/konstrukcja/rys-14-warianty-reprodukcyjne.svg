cznie sygnet uproszczony, minimum 15 mm; groty jako ścieg satynowy, kropka jako ścieg wypełniający</text><text x="24.00" y="396.00" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="9.8" font-weight="600" letter-spacing="0" fill="#181818" text-anchor="start">Pantone</text><text x="250.00" y="396.00" font-family="'IBM Plex Sans','DejaVu Sans',sans-serif" font-size="9.8" font-weight="400" letter-spacing="0" fill="#616161" text-anchor="start">numer do ustalenia z drukarnią na próbie — nie podajemy numeru bez wydruku kontrolnego</text><line x1="24.00" y1="446.00" x2="936.00" y2="446.00" stroke="#D7D7D7" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="24.00" y="462.00" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" letter-spacing="0" fill="#7C7C7C" text-anchor="start">konstrukcja/rys-14-warianty-reprodukcyjne.svg</text><text x="936.00" y="462.00" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" letter-spacing="0" fill="#7C7C7C" text-anchor="end">Danaco Console · v2.0</text></svg>