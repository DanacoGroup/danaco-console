<style>
  /* ══════════════════════════════════════════════════════════════════════════
     OKNO REJESTRACJI I LOGOWANIA — style lokalne (prefiks .au-*)
     Okno dwukolumnowe: kolumna tożsamości (atrament) i kolumna formularza
     (powierzchnia). Szerokość docelowa 1040 px — okno jest pierwszym widokiem
     produktu i nosi jego wagę, nie wagę okienka dialogowego.
     Wyłącznie żetony var(--dn-*). Oba motywy.
     ══════════════════════════════════════════════════════════════════════════ */

  /* Ikony w przełączniku stanów i w zakładkach okna trzymają rozmiar żetonu. */
  .pt-przybornik-lokalny .dn-zakladka svg,
  .we-panel .dn-zakladka svg { width: var(--dn-wym-ikona-sm); height: var(--dn-wym-ikona-sm); flex: none; }

  /* Zakładki „Zaloguj się / Zarejestruj się" — pigułki nad formularzem. */
  .we-panel .dn-zakladki {
    align-self: flex-start;
    gap: var(--dn-od-1);
    padding: 3px;
    border: 1px solid var(--dn-obrys);
    border-radius: var(--dn-r-pill);
    background: var(--dn-powierzchnia-2);
  }
  .we-panel .dn-zakladka {
    border: 0; border-radius: var(--dn-r-pill);
    padding: 0 var(--dn-od-4);
    min-height: calc(var(--dn-wym-kontrolka) - var(--dn-od-2));
    color: var(--dn-tekst-3);
  }
  .we-panel .dn-zakladka::after { content: none; }
  /* Stan wybrany niesie PODŚWIETLENIE, nie wypełnienie: pigułka w pełnym
     błękicie czytała się jak przycisk działania, a to kontrolka wyboru między
     dwiema równorzędnymi drogami — wskazuje, gdzie stoisz, a nie co wykonasz.
     Wypełnienie sygnałowe zostaje zarezerwowane dla przycisku „Zaloguj się”
     pod formularzem, który jest właściwym działaniem tego okna. */
  .we-panel .dn-zakladka[aria-selected='true'] {
    background: var(--dn-sygnal-tlo);
    border: 1px solid var(--dn-sygnal-obrys);
    color: var(--dn-sygnal);
    font-weight: var(--dn-fw-polgruba);
  }
  .we-panel .dn-zakladka[aria-selected='true']:hover {
    background: var(--dn-sygnal-wypelnienie);
    color: var(--dn-tekst-inv);
  }






  .we-marka-godlo .kropka { fill: var(--dn-sygnal-500); }





  /* ── Kolumna formularza ─────────────────────────────────────────────────── */





  .au-pola { display: flex; flex-direction: column; gap: var(--dn-od-4); }
  .au-para { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--dn-od-4); }

  /* pole hasła z odsłonięciem */
  .au-haslo { position: relative; display: flex; }
  .au-haslo > .dn-pole-kontrolka { width: 100%; padding-right: var(--dn-wym-kontrolka); }
  .au-haslo-oko {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    display: grid; place-content: center;
    width: calc(var(--dn-wym-kontrolka) - 4px); height: calc(var(--dn-wym-kontrolka) - 4px);
    border: 0; border-radius: var(--dn-r-sm); background: transparent;
    color: var(--dn-tekst-3); cursor: pointer;
    transition: color var(--dn-czas-1) var(--dn-ease), background-color var(--dn-czas-1) var(--dn-ease);
  }
  .au-haslo-oko:hover { background: var(--dn-hover); color: var(--dn-tekst); }
  .au-haslo-oko svg { width: var(--dn-wym-ikona-sm); height: var(--dn-wym-ikona-sm); }
  .au-haslo-oko .ik-zakryte { display: none; }
  .au-haslo-oko[aria-pressed='true'] .ik-odkryte { display: none; }
  .au-haslo-oko[aria-pressed='true'] .ik-zakryte { display: block; }

  /* wskaźnik siły hasła */
  .au-sila { display: flex; flex-direction: column; gap: var(--dn-od-2); margin-top: var(--dn-od-3); }
  .au-sila-tor { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
  .au-sila-odc { height: 3px; border-radius: var(--dn-r-pill); background: var(--dn-obrys); }
  .au-sila[data-stopien='1'] .au-sila-odc:nth-child(-n+1),
  .au-sila[data-stopien='2'] .au-sila-odc:nth-child(-n+2) { background: var(--dn-ostrzezenie-tekst); }
  .au-sila[data-stopien='3'] .au-sila-odc:nth-child(-n+3),
  .au-sila[data-stopien='4'] .au-sila-odc { background: var(--dn-sukces-tekst); }
  .au-sila-opis { font-size: var(--dn-fs-xs); color: var(--dn-tekst-3); }
  .au-sila-warunki { display: flex; flex-wrap: wrap; gap: var(--dn-od-1) var(--dn-od-3); font-size: var(--dn-fs-xs); color: var(--dn-tekst-3); }
  .au-sila-warunek { display: inline-flex; align-items: center; gap: var(--dn-od-1); }
  .au-sila-warunek svg { width: 12px; height: 12px; }
  .au-sila-warunek[data-spelniony='tak'] { color: var(--dn-sukces-tekst); }

  /* Głowa panelu: tytuł, tor kroków odzyskiwania i zdanie wprowadzające.
     Reset zeruje marginesy nagłówkom i akapitom, więc odstęp musi wnieść
     kontener — inaczej trzy różne treści zlewają się w jeden blok. */
  .au-glowa { display: flex; flex-direction: column; gap: var(--dn-od-3); }
  .au-tytul {
    font-family: var(--dn-ff-naglowek);
    font-weight: var(--dn-fw-polgruba);
    font-size: var(--dn-fs-xl);
    letter-spacing: var(--dn-ls-naglowek);
    line-height: var(--dn-lh-ciasny);
    color: var(--dn-tekst);
  }
  .au-lid {
    max-width: 62ch;
    font-size: var(--dn-fs-sm);
    line-height: var(--dn-lh-luzny);
    color: var(--dn-tekst-3);
  }
  /* Tor kroków stoi między tytułem a zdaniem wprowadzającym — dostaje własne
     powietrze z obu stron, bo jest wskazaniem miejsca w procesie, nie tekstem. */
  .au-glowa .au-kroki { padding: var(--dn-od-1) 0; }

  /* wiersz opcji sesji */
  .au-opcje { display: flex; flex-direction: column; gap: var(--dn-od-3); }
  .au-opcja { display: flex; align-items: flex-start; gap: var(--dn-od-2); font-size: var(--dn-fs-sm); color: var(--dn-tekst-2); cursor: pointer; }
  .au-opcja small { display: block; font-size: var(--dn-fs-xs); color: var(--dn-tekst-3); }

  .au-wiersz { display: flex; align-items: center; justify-content: space-between; gap: var(--dn-od-3); flex-wrap: wrap; }


  /* Działania formularza układają się w kolumnę — przycisk główny na pełną
     szerokość, odsyłacz pod nim. */
  .au-akcje { display: flex; flex-direction: column; gap: var(--dn-od-2); }
  .au-akcje .dn-btn { justify-content: center; }
  .au-link { font-size: var(--dn-fs-sm); }
  /* Stopka panelu: przycisk i odnośnik obok siebie, nigdy stykające się —
     dwa różne wywołania muszą być rozdzielone odstępem, nie samą krawędzią. */
  /* Łącznik „lub" — rozdziela dwie równorzędne drogi wyjścia ze stopki.
     Bez niego odsyłacz i przycisk czytają się jako jedno zdanie. */
  .au-lacznik { color: var(--dn-tekst-3); font-size: var(--dn-fs-sm); }
  .au-stopka {
    display: flex;
    align-items: center;
    gap: var(--dn-od-2);
    flex-wrap: wrap;
    font-size: var(--dn-fs-sm);
    color: var(--dn-tekst-3);
  }
  .au-rozdzielacz { display: flex; align-items: center; gap: var(--dn-od-3); color: var(--dn-tekst-3); font-size: var(--dn-fs-xs); }
  .au-rozdzielacz::before, .au-rozdzielacz::after { content: ''; flex: 1; height: 1px; background: var(--dn-obrys-subtelny); }

  .au-metody { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--dn-od-2); }
  .au-metoda {
    display: flex; flex-direction: column; align-items: center; gap: var(--dn-od-1);
    padding: var(--dn-od-3) var(--dn-od-2);
    border: 1px solid var(--dn-obrys); border-radius: var(--dn-r-md);
    background: var(--dn-panel); color: var(--dn-tekst-2);
    font-size: var(--dn-fs-xs); text-align: center; cursor: pointer;
    transition: border-color var(--dn-czas-1) var(--dn-ease), background-color var(--dn-czas-1) var(--dn-ease), transform var(--dn-czas-1) var(--dn-ease);
  }
  .au-metoda:hover { border-color: var(--dn-obrys-mocny); background: var(--dn-powierzchnia); transform: translateY(-1px); }
  .au-metoda svg { width: var(--dn-wym-ikona); height: var(--dn-wym-ikona); color: var(--dn-tekst-3); }
  .au-metoda[data-aktywna='nie'] { color: var(--dn-tekst-3); }
  .au-metoda-stan { font-family: var(--dn-ff-mono); font-size: 10px; color: var(--dn-tekst-3); }



  /* ── Kod potwierdzający ─────────────────────────────────────────────────── */
  .au-kod { display: flex; gap: var(--dn-od-2); }
  .au-kod-pole {
    width: 52px; height: 60px; flex: none;
    border: 1px solid var(--dn-obrys-mocny); border-radius: var(--dn-r-md);
    background: var(--dn-powierzchnia); color: var(--dn-tekst);
    font-family: var(--dn-ff-mono); font-size: var(--dn-fs-2xl); text-align: center;
    transition: border-color var(--dn-czas-1) var(--dn-ease), box-shadow var(--dn-czas-1) var(--dn-ease);
  }
  .au-kod-pole:focus { outline: none; border-color: var(--dn-fokus); box-shadow: var(--dn-cien-sygnal); }
  .au-kod-adres { font-family: var(--dn-ff-mono); color: var(--dn-tekst); }
  .au-kod-stopka { display: flex; align-items: center; gap: var(--dn-od-4); flex-wrap: wrap; font-size: var(--dn-fs-sm); }
  .au-odliczanie { font-family: var(--dn-ff-mono); font-size: var(--dn-fs-sm); color: var(--dn-tekst-3); }
  .au-odliczanie b { color: var(--dn-tekst); font-weight: var(--dn-fw-srednia); }

  /* ── Kroki odzyskiwania ─────────────────────────────────────────────────── */
  .au-kroki { display: flex; align-items: center; gap: var(--dn-od-2); font-size: var(--dn-fs-xs); color: var(--dn-tekst-3); }
  .au-krok { display: inline-flex; align-items: center; gap: var(--dn-od-1); }
  .au-krok-nr {
    display: grid; place-content: center; width: 20px; height: 20px;
    border: 1px solid var(--dn-obrys-mocny); border-radius: var(--dn-r-pill);
    font-family: var(--dn-ff-mono); font-size: 11px;
  }
  .au-krok[data-biezacy='tak'] { color: var(--dn-tekst); }
  .au-krok[data-biezacy='tak'] .au-krok-nr { border-color: var(--dn-sygnal-obrys); background: var(--dn-sygnal-tlo); color: var(--dn-sygnal); }
  .au-krok-strzalka { color: var(--dn-tekst-3); }

  /* ── Komunikat błędu w oknie ────────────────────────────────────────────── */
  .au-alarm {
    display: flex; gap: var(--dn-od-3); padding: var(--dn-od-3);
    border: 1px solid var(--dn-blad-obrys); border-left-width: 2px;
    border-radius: var(--dn-r-md); background: var(--dn-blad-tlo);
    font-size: var(--dn-fs-sm); line-height: var(--dn-lh-bazowy); color: var(--dn-tekst-2);
  }
  .au-alarm svg { width: var(--dn-wym-ikona); height: var(--dn-wym-ikona); flex: none; color: var(--dn-blad-tekst); }
  .au-alarm b { color: var(--dn-blad-tekst); }
  .au-alarm--informacja { border-color: var(--dn-informacja-obrys); background: var(--dn-informacja-tlo); }
  .au-alarm--informacja svg, .au-alarm--informacja b { color: var(--dn-informacja-tekst); }
  .au-alarm--sukces { border-color: var(--dn-sukces-obrys); background: var(--dn-sukces-tlo); }
  .au-alarm--sukces svg, .au-alarm--sukces b { color: var(--dn-sukces-tekst); }

  /* ── Progi ──────────────────────────────────────────────────────────────── */
  @media (max-width: 1000px) {
    .we-okno { grid-template-columns: minmax(0, 1fr); }
    .we-marka { display: none; }
  }
  @media (max-width: 640px) {
    .we-panel { padding: var(--dn-od-5) var(--dn-od-4); }
    .au-para, .au-metody { grid-template-columns: minmax(0, 1fr); }
    .au-kod-pole { width: 40px; height: 48px; font-size: var(--dn-fs-lg); }
  }
</style>
</head>

<script src="../../zasoby/rama.js"></script>
<script>
(function () {
  'use strict';
  var D = document;
  function all(s) { return Array.prototype.slice.call(D.querySelectorAll(s)); }

  /* Odsłonięcie hasła — kontrolka zmienia typ pola i własną etykietę. */
  all('[data-odsloniecie]').forEach(function (b) {
    b.addEventListener('click', function () {
      var pole = D.getElementById(b.getAttribute('data-odsloniecie'));
      if (!pole) return;
      var odkryte = pole.type === 'text';
      pole.type = odkryte ? 'password' : 'text';
      b.setAttribute('aria-pressed', odkryte ? 'false' : 'true');
      b.setAttribute('aria-label', odkryte ? 'Pokaż hasło' : 'Ukryj hasło');
    });
  });

  /* Ocena siły hasła — cztery warunki, cztery stopnie. */
  var haslo = D.getElementById('rej-haslo');
  if (haslo) {
    var blok = haslo.closest('.dn-pole').parentNode.querySelector('.au-sila');
    var opis = blok.querySelector('[data-sila-opis]');
    var OPISY = ['Siła hasła zostanie oceniona podczas wpisywania', 'Hasło słabe — spełnia jeden warunek',
                 'Hasło dostateczne — spełnia dwa warunki', 'Hasło dobre — spełnia trzy warunki',
                 'Hasło mocne — spełnia wszystkie cztery warunki'];
    haslo.addEventListener('input', function () {
      var v = haslo.value;
      var w = {
        dlugosc: v.length >= 12,
        wielkosc: /[a-ząćęłńóśźż]/.test(v) && /[A-ZĄĆĘŁŃÓŚŹŻ]/.test(v),
        cyfra: /[0-9]/.test(v),
        znak: /[^0-9A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]/.test(v)
      };
      var stopien = 0;
      Object.keys(w).forEach(function (k) {
        var el = blok.querySelector('[data-warunek="' + k + '"]');
        if (el) el.setAttribute('data-spelniony', w[k] ? 'tak' : 'nie');
        if (w[k]) stopien += 1;
      });
      blok.setAttribute('data-stopien', String(stopien));
      opis.textContent = OPISY[stopien];
    });
  }

  /* Kod potwierdzający — przejście między polami i wklejenie całości. */
  var pola = all('[data-kod]');
  pola.forEach(function (p, i) {
    p.addEventListener('input', function () {
      p.value = p.value.replace(/[^0-9A-Za-z]/g, '').slice(0, 1).toUpperCase();
      if (p.value && pola[i + 1]) pola[i + 1].focus();
    });
    p.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !p.value && pola[i - 1]) pola[i - 1].focus();
    });
    p.addEventListener('paste', function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9A-Za-z]/g, '');
      pola.forEach(function (q, j) { q.value = (t[j] || '').toUpperCase(); });
      (pola[Math.min(t.length, pola.length - 1)] || p).focus();
    });
  });
})();
</script>
