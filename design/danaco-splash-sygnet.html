<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danaco Console — ekran startowy</title>
<link rel="icon" href="zasoby/marka/favicon/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="zasoby/zetony/fonty.css">
<link rel="stylesheet" href="zasoby/zetony/zetony.css">
<link rel="stylesheet" href="zasoby/css/fundament.css">
<link rel="stylesheet" href="zasoby/css/komponenty.css">
<link rel="stylesheet" href="zasoby/ekran-startowy.css">

<!--
  ============================================================================
  PODGLĄD — EKRAN STARTOWY DANACO CONSOLE
  ----------------------------------------------------------------------------
  Animacja odtwarzana po kliknięciu ikony programu, zanim stanie okno. Ten plik
  jej nie zawiera — wpina składnik biblioteki i wskazuje miejsce, w którym ma
  stanąć. Rzecz sama leży w zasoby/ekran-startowy.js.

  Pole ma trzy kadry, żeby dało się ocenić znak w każdej wielkości, w jakiej
  powłoka może go postawić. Wszystkie trzy grają w kółko — powtarzanie należy
  do podglądu, nie do ekranu startowego.

  Trzeci kadr stoi na pulpicie zastępczym, bo ekran startowy nie ma własnego
  tła i to jest jego właściwość, nie brak: w produkcie kładzie się na tapecie
  użytkownika.
  ============================================================================
-->
<body class="es-podglad">

<div class="es-siatka">
  <figure class="es-kadr">
    <div class="dn-ekran-startowy" data-ekran-startowy data-powtarzaj
         role="img" aria-label="Uruchamianie Danaco Console"></div>
    <figcaption class="es-podpis">560 × 420 — wielkość powłoki</figcaption>
  </figure>

  <figure class="es-kadr es-kadr--male">
    <div class="dn-ekran-startowy" data-ekran-startowy data-powtarzaj
         role="img" aria-label="Uruchamianie Danaco Console"></div>
    <figcaption class="es-podpis">280 × 210 — połowa</figcaption>
  </figure>

  <figure class="es-kadr es-kadr--pulpit">
    <div class="dn-ekran-startowy" data-ekran-startowy data-powtarzaj
         role="img" aria-label="Uruchamianie Danaco Console"></div>
    <figcaption class="es-podpis">na pulpicie — bez własnego tła</figcaption>
  </figure>
</div>

<script src="zasoby/ekran-startowy.js"></script>
</body>
</html>
